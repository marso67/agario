<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Agario</title>
<style>
  :root { --blue: #2b6ef6; --card: #131c31; --bg: #0a0f1c; --text: #cfd8ea; }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: var(--bg); font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; color: var(--text); }
  
  body.playing:not(.paused) { cursor: none; }
  body.playing #menu { display: none; }
  canvas#game { display: none; width: 100vw; height: 100vh; }
  body.playing canvas#game { display: block; }

  #menu { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 20px; overflow-y: auto; z-index: 100; }
  #topCounters { display: flex; gap: 12px; margin-bottom: 20px; }
  .counter { background: #1c2740; border-radius: 16px; padding: 6px 16px; font-size: 14px; }
  .counter b { color: #fff; }

  #mainArea { display: flex; gap: 24px; align-items: flex-start; max-width: 800px; width: 100%; }
  #startCard { background: var(--card); border-radius: 18px; padding: 24px; width: 380px; flex-shrink: 0; }
  #startImage { width: 100%; height: 220px; border-radius: 12px; overflow: hidden; margin-bottom: 20px;
    background-image: url('start.png'); background-size: cover; background-position: center; background-repeat: no-repeat; }

  .btns { display: flex; gap: 12px; margin-bottom: 16px; }
  .btn { border: 0; border-radius: 20px; padding: 12px 22px; font-size: 14px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; flex: 1; justify-content: center; transition: 0.2s; }
  .btn:hover { filter: brightness(1.1); }
  .btn.white { background: #fff; color: var(--blue); }
  .btn.blue { background: var(--blue); color: #fff; }

  .nick-wrap { display: flex; align-items: center; gap: 8px; background: #1c2740; border-radius: 20px; padding: 4px; }
  #nick { flex: 1; background: transparent; border: 0; padding: 10px 14px; color: #fff; font-size: 14px; outline: none; }
  #colorDot { width: 28px; height: 28px; border-radius: 50%; background: #ffa502; cursor: pointer; border: 0; margin-left: -5px; }

  #statsCard { background: var(--card); border-radius: 18px; padding: 20px; width: 380px; flex-shrink: 0; }
  .stats-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .stats-head h2 { margin: 0; font-size: 20px; color: #fff; }
  .period { background: #1c2740; border-radius: 12px; padding: 6px 12px; font-size: 13px; cursor: pointer; }

  .stats-table { width: 100%; border-collapse: collapse; }
  .stats-table th { text-align: left; padding: 8px; color: #8fa1c0; font-size: 13px; font-weight: normal; border-bottom: 1px solid #1f2b45; }
  .stats-table td { padding: 10px 8px; font-size: 14px; border-bottom: 1px solid #1f2b45; color: #fff; }
  .stats-table .pos { width: 60px; text-align: center; }
  .stats-table .mass { width: 100px; text-align: right; }
  .stats-table .skin { width: 40px; }
  .skin-circle { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #c9a227; }
  .pos-1 { color: #f1c40f; font-weight: bold; }
  .pos-2 { color: #bdc3c7; }
  .pos-3 { color: #e67e22; }

  #hud { position: fixed; top: 10px; left: 12px; font-size: 14px; color: var(--text); display: none; z-index: 10; text-shadow: 1px 1px 2px #000; }
  body.playing #hud { display: block; }
  
  #minimap { position: fixed; right: 12px; bottom: 12px; width: 160px; height: 160px; background: rgba(13, 21, 38, 0.8); border: 1px solid #1f2b45; border-radius: 8px; display: none; z-index: 10; }
  body.playing #minimap { display: block; }

  #topNow { position: fixed; top: 12px; right: 12px; background: rgba(19, 28, 49, 0.85); border-radius: 12px; padding: 14px; width: 200px; max-height: 400px; overflow-y: auto; display: none; z-index: 10; backdrop-filter: blur(4px); }
  body.playing #topNow { display: block; }
  #topNow h3 { margin: 0 0 10px; font-size: 16px; color: #fff; text-align: center; }
  .top-item { padding: 4px 0; font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .top-item .num { width: 20px; color: #8fa1c0; }
  .top-item .name { flex: 1; color: #fff; }
  .top-item .mass-val { color: #8fa1c0; font-size: 12px; }
  .top-item.me { color: #2b6ef6; font-weight: bold; }
  .top-item.me .num, .top-item.me .mass-val { color: #2b6ef6; }

  #micBtn { position: fixed; left: 16px; bottom: 16px; width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--blue); color: #fff; cursor: pointer; display: none; align-items: center; justify-content: center; box-shadow: 0 0 0 0 rgba(43,110,246,0.6); transition: 0.2s; z-index: 10; }
  body.playing #micBtn { display: flex; }
  #micBtn.on { background: var(--blue); }
  #micBtn.off { background: #3a1620; color: #ff5566; }
  #micBtn svg { width: 24px; height: 24px; }
  #micBtn.talking { box-shadow: 0 0 0 10px rgba(43,110,246,0.25); }

  #pauseBtn { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(28, 39, 64, 0.9); border: 1px solid var(--blue); border-radius: 24px; padding: 12px 28px; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; display: none; align-items: center; gap: 8px; z-index: 50; backdrop-filter: blur(4px); }
  body.playing #pauseBtn { display: flex; }
  #pauseBtn:hover { background: var(--blue); }

  #debugInfo { position: fixed; bottom: 12px; left: 12px; font-size: 12px; color: #8fa1c0; display: none; z-index: 10; font-family: monospace; }
  body.playing #debugInfo { display: block; }
</style>
</head>
<body>

<div id="menu">
  <div id="topCounters">
    <div class="counter">Максимум: <b id="maxOnline">0</b></div>
    <div class="counter">Сейчас: <b id="curOnline">0</b></div>
  </div>
  <div id="mainArea">
    <div id="startCard">
      <div id="startImage"></div>
      <div class="btns">
        <button class="btn white" id="spectateBtn">👁 Наблюдать</button>
        <button class="btn blue" id="playBtn">▶ ИГРАТЬ</button>
      </div>
      <div class="nick-wrap">
        <input id="nick" placeholder="nick" maxlength="15">
        <button id="colorDot" title="Перемешать цвет"></button>
      </div>
    </div>
    <div id="statsCard">
      <div class="stats-head">
        <h2>Статистика</h2>
        <div class="period">Сегодня ⌄</div>
      </div>
      <table class="stats-table">
        <thead><tr><th class="pos">Позиция</th><th>Ник</th><th class="mass">Масса</th><th class="skin">Скин</th></tr></thead>
        <tbody id="statsBody"></tbody>
      </table>
    </div>
  </div>
</div>

<canvas id="game"></canvas>
<div id="hud">Масса: <b id="mass">20</b> · Позиция: <span id="pos">0, 0</span></div>
<canvas id="minimap" width="160" height="160"></canvas>

<div id="topNow">
  <h3>Топ Сейчас</h3>
  <div id="topNowList"></div>
</div>

<button id="micBtn" title="Микрофон">
  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
</button>

<button id="pauseBtn">Pause ⏸</button>
<div id="debugInfo">FPS: <span id="fps">60</span> | Ping: <span id="ping">12</span>ms</div>

<script>
// ================= КОНФИГУРАЦИЯ С ТОЧНЫМИ КОНСТАНТАМИ ОРИГИНАЛА =================
const CFG = {
  WORLD: 14142,
  FOOD_COUNT: 3000,
  FOOD_MASS: 20,
  VIRUS_COUNT: 70,
  BOTS: 50,
  RESPAWN_MS: 10000,
  MAX_CELLS: 16,
  MIN_CELL_MASS: 10,
  EJECT_MASS: 10,
  EAT_DIFFERENCE: 100,

  // ТОЧНЫЕ ФОРМУЛЫ ОРИГИНАЛА:
  RADIUS_CONSTANT: 4.3, 
  
  SPEED_CONSTANT: 2.2, 
  SPEED_EXPONENT: 0.435, 
  
  SPLIT_IMPULSE: 32, 
  SPLIT_FRICTION: 0.88, 
  
  VIRUS_MASS: 100,
  VIRUS_EXPLODE_PIECES: 16, 
  
  MERGE_COOLDOWN_SECONDS: 15, 
  MERGE_PUSH_FORCE: 0.5 
};

const SKINS = { 'ракета': 'raketa.png' };
const skinImages = {};
for (const key in SKINS) {
  const img = new Image();
  img.src = SKINS[key];
  skinImages[key] = img;
}

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
const mm = document.getElementById('minimap').getContext('2d');
let W = innerWidth, H = innerHeight;
canvas.width = W; canvas.height = H;
addEventListener('resize', () => { W = innerWidth; H = innerHeight; canvas.width = W; canvas.height = H; });

const mouse = { x: W / 2, y: H / 2 };
addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

const COLORS = ['#ff4757','#ffa502','#2ed573','#1e90ff','#a55eea','#ff6b81','#7bed9f','#70a1ff','#e74c3c','#3498db','#9b59b6','#1abc9c','#f1c40f','#e67e22'];
const rndColor = () => COLORS[(Math.random() * COLORS.length) | 0];

const player = { nick: 'nick', color: rndColor(), skin: null, cells: [] };

const cam = { x: CFG.WORLD / 2, y: CFG.WORLD / 2, baseZoom: 1, zoom: 1 };
let spectate = false, running = false, paused = false;
let curOnline = 0, maxOnline = 0;

let manualZoom = 1.0;
const MIN_MANUAL_ZOOM = 0.1;
const MAX_MANUAL_ZOOM = 4.0;

// ⬅️ ОБНОВЛЕННАЯ ФОРМУЛА РАДИУСА
const getR = m => Math.sqrt(m) * CFG.RADIUS_CONSTANT;
const rnd = (a, b) => a + Math.random() * (b - a);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

// ⬅️ ОБНОВЛЕННАЯ ФОРМУЛА СКОРОСТИ
function speedFor(mass) {
  return Math.max(0.8, CFG.SPEED_CONSTANT * Math.pow(20 / mass, CFG.SPEED_EXPONENT));
}

const foods = [];
const spawnFood = () => ({ x: rnd(0, CFG.WORLD), y: rnd(0, CFG.WORLD), r: rnd(3, 5), color: `hsl(${rnd(0, 360)}, 70%, 55%)` });

const viruses = [];
const spawnVirus = () => ({ 
  x: rnd(0, CFG.WORLD), 
  y: rnd(0, CFG.WORLD), 
  r: 35, 
  mass: CFG.VIRUS_MASS, 
  spikes: 16 
});

function respawnWave() {
  for (let i = 0; i < CFG.FOOD_COUNT / 5; i++) foods.push(spawnFood());
  for (let i = 0; i < CFG.VIRUS_COUNT / 5; i++) viruses.push(spawnVirus());
}
for (let i = 0; i < CFG.FOOD_COUNT; i++) foods.push(spawnFood());
for (let i = 0; i < CFG.VIRUS_COUNT; i++) viruses.push(spawnVirus());
setInterval(respawnWave, CFG.RESPAWN_MS);

const bots = [];
const spawnBot = () => ({ 
  x: rnd(0, CFG.WORLD), y: rnd(0, CFG.WORLD), mass: rnd(15, 300),
  nick: 'bot' + ((Math.random() * 999) | 0), color: rndColor(), r: 0, tx: 0, ty: 0, vx: 0, vy: 0 
});
for (let i = 0; i < CFG.BOTS; i++) bots.push(spawnBot());

const pellets = [];

function ejectMass() {
  for (const cell of player.cells) {
    if (cell.mass < CFG.MIN_CELL_MASS * 2) continue;
    cell.mass -= CFG.EJECT_MASS;
    const wx = (mouse.x - W / 2) / cam.zoom + cam.x;
    const wy = (mouse.y - H / 2) / cam.zoom + cam.y;
    const dx = wx - cell.x, dy = wy - cell.y;
    const d = Math.hypot(dx, dy) || 1;
    pellets.push({
      x: cell.x + (dx / d) * getR(cell.mass),
      y: cell.y + (dy / d) * getR(cell.mass),
      mass: CFG.EJECT_MASS, r: getR(CFG.EJECT_MASS),
      vx: (dx / d) * 20, vy: (dy / d) * 20, color: player.color
    });
  }
}

function split() {
  const newCells = [];
  for (const cell of player.cells) {
    if (player.cells.length + newCells.length >= CFG.MAX_CELLS) break;
    if (cell.mass < CFG.MIN_CELL_MASS * 2) continue;
    const half = cell.mass / 2;
    cell.mass = half;
    const wx = (mouse.x - W / 2) / cam.zoom + cam.x;
    const wy = (mouse.y - H / 2) / cam.zoom + cam.y;
    const dx = wx - cell.x, dy = wy - cell.y;
    const d = Math.hypot(dx, dy) || 1;
    const offset = getR(half) + 2;
    const newCell = {
      x: cell.x + (dx / d) * offset,
      y: cell.y + (dy / d) * offset,
      mass: half,
      vx: (dx / d) * CFG.SPLIT_IMPULSE, // ⬅️ Использована константа
      vy: (dy / d) * CFG.SPLIT_IMPULSE, // ⬅️ Использована константа
      mergeCooldown: CFG.MERGE_COOLDOWN_SECONDS, // ⬅️ Использована константа
      nick: player.nick,
      color: player.color,
      skin: player.skin
    };
    cell.vx = -(dx / d) * (CFG.SPLIT_IMPULSE * 0.5);
    cell.vy = -(dy / d) * (CFG.SPLIT_IMPULSE * 0.5);
    cell.mergeCooldown = CFG.MERGE_COOLDOWN_SECONDS; // ⬅️ Использована константа
    newCells.push(newCell);
  }
  player.cells.push(...newCells);
}

// ================= ВЗРЫВ ОТ КУСТА (С НЕРАВНЫМ РАСПРЕДЕЛЕНИЕМ МАССЫ) =================
function explodeCell(cellsArray, cellIndex, virus) {
  const c = cellsArray[cellIndex];
  const maxPieces = Math.min(CFG.VIRUS_EXPLODE_PIECES, CFG.MAX_CELLS - cellsArray.length + 1);
  if (maxPieces <= 1) return;

  // ⬅️ ОРИГИНАЛЬНАЯ ЛОГИКА: одна часть забирает ~55% массы, остальные делят остаток
  const mainPieceMass = c.mass * 0.55;
  const remainingMass = c.mass - mainPieceMass;
  const smallPieceMass = remainingMass / (maxPieces - 1);

  c.mass = mainPieceMass;
  c.mergeCooldown = CFG.MERGE_COOLDOWN_SECONDS;

  const newCells = [];
  for (let k = 1; k < maxPieces; k++) {
    const angle = Math.random() * Math.PI * 2;
    const offset = getR(smallPieceMass) + 2;
    const newCell = {
      x: c.x + Math.cos(angle) * offset,
      y: c.y + Math.sin(angle) * offset,
      mass: smallPieceMass,
      vx: Math.cos(angle) * CFG.SPLIT_IMPULSE,
      vy: Math.sin(angle) * CFG.SPLIT_IMPULSE,
      mergeCooldown: CFG.MERGE_COOLDOWN_SECONDS,
      nick: c.nick,
      color: c.color,
      skin: c.skin
    };
    newCells.push(newCell);
  }

  const pushAngle = Math.atan2(c.y - virus.y, c.x - virus.x);
  c.vx += Math.cos(pushAngle) * (CFG.SPLIT_IMPULSE * 0.5);
  c.vy += Math.sin(pushAngle) * (CFG.SPLIT_IMPULSE * 0.5);

  cellsArray.push(...newCells);
}

function checkVirusCollision(cellsArray) {
  for (let i = viruses.length - 1; i >= 0; i--) {
    const v = viruses[i];
    let virusRemoved = false;

    for (let j = 0; j < cellsArray.length; j++) {
      const c = cellsArray[j];
      const d = Math.hypot(c.x - v.x, c.y - v.y);

      if (d < c.r) {
        if (c.mass >= v.mass + 10) {
          c.mass += v.mass;
          virusRemoved = true;
          break;
        } else {
          explodeCell(cellsArray, j, v);
          virusRemoved = true;
          break;
        }
      }
    }

    if (virusRemoved) {
      viruses.splice(i, 1);
    }
  }
}

addEventListener('wheel', e => {
  if (!running) return;
  e.preventDefault();
  const zoomStep = 0.1;
  if (e.deltaY < 0) {
    manualZoom *= (1 + zoomStep);
  } else {
    manualZoom *= (1 - zoomStep);
  }
  manualZoom = Math.max(MIN_MANUAL_ZOOM, Math.min(MAX_MANUAL_ZOOM, manualZoom));
}, { passive: false });

addEventListener('keydown', e => {
  if (!running) return;
  const key = e.key.toLowerCase();
  if (key === 'f' || key === 'а') { togglePause(); }
  if (key === ' ' && !paused) { split(); e.preventDefault(); }
  if ((key === 'w' || key === 'ц') && !paused) ejectMass();
});

const pauseBtn = document.getElementById('pauseBtn');
function togglePause() {
  paused = !paused;
  pauseBtn.innerHTML = paused ? 'Play ▶' : 'Pause ⏸';
  document.body.classList.toggle('paused', paused);
}
pauseBtn.onclick = togglePause;

document.getElementById('playBtn').onclick = () => start(false);
document.getElementById('spectateBtn').onclick = () => start(true);
document.getElementById('colorDot').onclick = e => {
  player.color = rndColor();
  e.target.style.background = player.color;
};

function updateOnlineCounters() {
  curOnline = running ? 1 : 0;
  if (curOnline > maxOnline) maxOnline = curOnline;
  document.getElementById('curOnline').textContent = curOnline;
  document.getElementById('maxOnline').textContent = maxOnline;
}

function loadDailyStats() {
  const today = new Date().toDateString();
  try {
    const stored = JSON.parse(localStorage.getItem('agario_daily') || '{}');
    if (stored.date !== today) return { date: today, records: [] };
    return stored;
  } catch (e) { return { date: today, records: [] }; }
}

function saveDailyRecord(mass) {
  const data = loadDailyStats();
  data.records.push({ mass: Math.round(mass), time: Date.now() });
  data.records.sort((a, b) => b.mass - a.mass);
  data.records = data.records.slice(0, 100);
  localStorage.setItem('agario_daily', JSON.stringify(data));
  renderDailyStats();
}

function renderDailyStats() {
  const data = loadDailyStats();
  const tbody = document.getElementById('statsBody');
  tbody.innerHTML = '';
  const top10 = data.records.slice(0, 10);
  if (top10.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#8fa1c0">Пока нет рекордов</td></tr>';
    return;
  }
  for (let i = 0; i < top10.length; i++) {
    const tr = document.createElement('tr');
    const posClass = i < 3 ? `pos-${i + 1}` : '';
    tr.innerHTML = `
      <td class="pos ${posClass}">${i + 1}</td>
      <td>Ник</td>
      <td class="mass">${top10[i].mass}</td>
      <td class="skin"><div class="skin-circle" style="background:${rndColor()}"></div></td>
    `;
    tbody.appendChild(tr);
  }
}
renderDailyStats();
setInterval(renderDailyStats, 60000);

function start(spec) {
  player.nick = document.getElementById('nick').value || 'nick';
  player.color = rndColor();
  player.skin = skinImages[player.nick.trim().toLowerCase()] || null;
  player.cells = [{ 
    x: rnd(0, CFG.WORLD), y: rnd(0, CFG.WORLD), mass: 20, vx: 0, vy: 0, mergeCooldown: 0,
    nick: player.nick, color: player.color, skin: player.skin 
  }];
  cam.x = player.cells[0].x; 
  cam.y = player.cells[0].y; 
  cam.baseZoom = 1.0;
  manualZoom = 1.0;
  cam.zoom = 1.0;
  
  document.getElementById('colorDot').style.background = player.color;
  spectate = spec;
  paused = false;
  pauseBtn.innerHTML = 'Pause ⏸';
  document.body.classList.remove('paused');
  document.body.classList.add('playing');
  running = true;
  updateOnlineCounters();
  requestMic();
  lastTime = performance.now();
  animate();
}

const micBtn = document.getElementById('micBtn');
let micStream = null, micOn = false, micDenied = false, audioCtx = null, analyser = null;
async function requestMic() {
  if (micStream || micDenied) return;
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    micOn = true; paintMic();
    audioCtx = new AudioContext();
    analyser = audioCtx.createAnalyser(); analyser.fftSize = 256;
    audioCtx.createMediaStreamSource(micStream).connect(analyser);
  } catch (e) { micDenied = true; paintMic(); }
}
micBtn.onclick = () => {
  if (!micStream) { requestMic(); return; }
  micOn = !micOn;
  micStream.getAudioTracks()[0].enabled = micOn;
  paintMic();
};
function paintMic() {
  micBtn.className = micOn ? 'on' : 'off';
  micBtn.innerHTML = micOn
    ? `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>`
    : `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/><line x1="3" y1="3" x2="21" y2="21" stroke="currentColor" stroke-width="2"/></svg>`;
}

function drawVirus(v) {
  ctx.save();
  ctx.translate(v.x, v.y);
  ctx.beginPath();
  for (let i = 0; i < v.spikes; i++) {
    const a = (i / v.spikes) * Math.PI * 2;
    const rOut = v.r, rIn = v.r * 0.78;
    ctx.lineTo(Math.cos(a) * rOut, Math.sin(a) * rOut);
    ctx.lineTo(Math.cos(a + Math.PI / v.spikes) * rIn, Math.sin(a + Math.PI / v.spikes) * rIn);
  }
  ctx.closePath();
  ctx.fillStyle = '#22c55e'; ctx.fill();
  ctx.strokeStyle = '#15803d'; ctx.lineWidth = 2 / cam.zoom; ctx.stroke();
  ctx.restore();
}

function renderTopNow() {
  const list = document.getElementById('topNowList');
  list.innerHTML = '';
  const players = [];
  if (running && player.cells.length > 0) {
    const totalMass = player.cells.reduce((s, c) => s + c.mass, 0);
    players.push({ mass: totalMass, nick: player.nick, isMe: true });
  }
  for (const b of bots) players.push({ mass: b.mass, nick: b.nick, isMe: false });
  
  players.sort((a, b) => b.mass - a.mass);
  const top10 = players.slice(0, 10);
  
  top10.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'top-item' + (p.isMe ? ' me' : '');
    div.innerHTML = `<span class="num">${i + 1}.</span><span class="name">${p.nick}</span><span class="mass-val">${Math.round(p.mass)}</span>`;
    list.appendChild(div);
  });
}
setInterval(renderTopNow, 2000);
renderTopNow();

let lastTime = performance.now();
let frameCount = 0, lastFpsTime = 0;

function animate(now = performance.now()) {
  if (!running) return;
  requestAnimationFrame(animate);

  frameCount++;
  if (now - lastFpsTime >= 1000) {
    document.getElementById('fps').textContent = frameCount;
    frameCount = 0;
    lastFpsTime = now;
  }

  ctx.fillStyle = '#0a0f1c';
  ctx.fillRect(0, 0, W, H);

  if (!paused) {
    let totalMass = 0, cx = 0, cy = 0;
    for (const cell of player.cells) {
      totalMass += cell.mass;
      cx += cell.x * cell.mass;
      cy += cell.y * cell.mass;
    }
    if (totalMass > 0) { cx /= totalMass; cy /= totalMass; }

    cam.x += (cx - cam.x) * 0.12;
    cam.y += (cy - cam.y) * 0.12;
    
    const desiredBaseZoom = Math.max(0.2, Math.min(1.5, Math.pow(30 / getR(totalMass || 20), 0.55)));
    cam.baseZoom += (desiredBaseZoom - cam.baseZoom) * 0.1;
    cam.zoom = cam.baseZoom * manualZoom;

    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.scale(cam.zoom, cam.zoom);
    ctx.translate(-cam.x, -cam.y);

    ctx.strokeStyle = '#1a2438'; ctx.lineWidth = 1 / cam.zoom;
    const step = 100;
    const x0 = Math.max(0, ((cam.x - W / 2 / cam.zoom) / step | 0) * step);
    const x1 = Math.min(CFG.WORLD, cam.x + W / 2 / cam.zoom);
    const y0 = Math.max(0, ((cam.y - H / 2 / cam.zoom) / step | 0) * step);
    const y1 = Math.min(CFG.WORLD, cam.y + H / 2 / cam.zoom);
    ctx.beginPath();
    for (let x = x0; x <= x1; x += step) { ctx.moveTo(x, y0); ctx.lineTo(x, y1); }
    for (let y = y0; y <= y1; y += step) { ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
    ctx.stroke();
    ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 6 / cam.zoom;
    ctx.strokeRect(0, 0, CFG.WORLD, CFG.WORLD);

    // Движение игрока
    for (const cell of player.cells) {
      const wx = (mouse.x - W / 2) / cam.zoom + cam.x;
      const wy = (mouse.y - H / 2) / cam.zoom + cam.y;
      const dx = wx - cell.x, dy = wy - cell.y;
      const d = Math.hypot(dx, dy);
      if (d > 2) {
        const sp = speedFor(cell.mass);
        cell.vx += (dx / d) * sp * 0.15;
        cell.vy += (dy / d) * sp * 0.15;
      }
      // ⬅️ ИСПОЛЬЗОВАНА КОНСТАНТА ТРЕНИЯ
      cell.vx *= CFG.SPLIT_FRICTION;
      cell.vy *= CFG.SPLIT_FRICTION;
      cell.x += cell.vx;
      cell.y += cell.vy;
      cell.x = Math.max(0, Math.min(CFG.WORLD, cell.x));
      cell.y = Math.max(0, Math.min(CFG.WORLD, cell.y));
      cell.r = getR(cell.mass);
      if (cell.mergeCooldown > 0) cell.mergeCooldown -= 1 / 60;
    }

    // Слияние клеток игрока
    for (let i = 0; i < player.cells.length; i++) {
      for (let j = i + 1; j < player.cells.length; j++) {
        const a = player.cells[i], b = player.cells[j];
        if (a.mergeCooldown > 0 || b.mergeCooldown > 0) continue;
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy);
        const minDist = getR(a.mass) + getR(b.mass);
        if (d < minDist * 0.8) {
          a.mass += b.mass;
          player.cells.splice(j, 1);
          j--;
        } else {
          // ⬅️ ИСПОЛЬЗОВАНА КОНСТАНТА СИЛЫ ОТТАЛКИВАНИЯ
          const force = CFG.MERGE_PUSH_FORCE;
          a.vx += (dx / d) * force;
          a.vy += (dy / d) * force;
          b.vx -= (dx / d) * force;
          b.vy -= (dy / d) * force;
        }
      }
    }

    // ИИ Ботов
    for (const b of bots) {
      b.r = getR(b.mass);
      let targetX = b.tx, targetY = b.ty;
      let flee = false;

      for (const other of [...player.cells, ...bots]) {
        if (other === b) continue;
        const d = dist(b, other);
        if (d < 400) {
          if (other.mass > b.mass * 1.2) {
            targetX = b.x - (other.x - b.x) * 2;
            targetY = b.y - (other.y - b.y) * 2;
            flee = true;
            break;
          } else if (b.mass > other.mass * 1.2 && d < 200) {
            targetX = other.x;
            targetY = other.y;
            flee = false;
          }
        }
      }

      if (!flee && (!targetX || Math.hypot(targetX - b.x, targetY - b.y) < 20 || Math.random() < 0.02)) {
        const f = foods[(Math.random() * foods.length) | 0];
        if (f) { targetX = f.x; targetY = f.y; }
      }

      const dx = targetX - b.x, dy = targetY - b.y;
      const d = Math.hypot(dx, dy) || 1;
      const sp = speedFor(b.mass);
      b.vx = (dx / d) * sp;
      b.vy = (dy / d) * sp;
      b.x += b.vx;
      b.y += b.vy;
      b.x = Math.max(0, Math.min(CFG.WORLD, b.x));
      b.y = Math.max(0, Math.min(CFG.WORLD, b.y));
    }

    const allCells = [...player.cells, ...bots];

    // Поедание еды
    for (const c of allCells) {
      for (let i = foods.length - 1; i >= 0; i--) {
        const f = foods[i];
        if (Math.abs(f.x - c.x) < c.r && Math.abs(f.y - c.y) < c.r) {
          c.mass += CFG.FOOD_MASS;
          foods.splice(i, 1);
        }
      }
    }

    // Взаимодействие с кустами
    checkVirusCollision(player.cells);
    checkVirusCollision(bots);

    // Поедание порошков
    const updatedAllCells = [...player.cells, ...bots];
    for (const c of updatedAllCells) {
      for (let i = pellets.length - 1; i >= 0; i--) {
        const p = pellets[i];
        if (Math.abs(p.x - c.x) < c.r && Math.abs(p.y - c.y) < c.r) {
          c.mass += p.mass;
          pellets.splice(i, 1);
        }
      }
    }

    // Поедание игроков/ботов
    let playerDied = false;
    const finalAllCells = [...player.cells, ...bots];
    for (let i = 0; i < finalAllCells.length; i++) {
      for (let j = 0; j < finalAllCells.length; j++) {
        if (i === j) continue;
        const a = finalAllCells[i], b = finalAllCells[j];
        if ((a.mass > b.mass + CFG.EAT_DIFFERENCE || (a.mass > 30 && a.mass > b.mass * 1.3)) && Math.hypot(a.x - b.x, a.y - b.y) < a.r) {
          a.mass += b.mass;
          const idx = player.cells.indexOf(b);
          if (idx >= 0) {
            player.cells.splice(idx, 1);
            if (player.cells.length === 0) {
              saveDailyRecord(totalMass);
              playerDied = true;
              player.cells = [{ x: rnd(0, CFG.WORLD), y: rnd(0, CFG.WORLD), mass: 20, vx: 0, vy: 0, mergeCooldown: 0, nick: player.nick, color: player.color, skin: player.skin }];
              player.color = rndColor();
            }
          }
          if (bots.includes(b)) Object.assign(b, spawnBot());
        }
      }
    }
    if (playerDied) updateOnlineCounters();

    // Движение порошков
    for (let i = pellets.length - 1; i >= 0; i--) {
      const p = pellets[i];
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.9; p.vy *= 0.9;
      p.x = Math.max(0, Math.min(CFG.WORLD, p.x));
      p.y = Math.max(0, Math.min(CFG.WORLD, p.y));
    }

    // Рендеринг
    const pad = 100 / cam.zoom;
    const inView = o => o.x > cam.x - W / 2 / cam.zoom - pad && o.x < cam.x + W / 2 / cam.zoom + pad &&
                        o.y > cam.y - H / 2 / cam.zoom - pad && o.y < cam.y + H / 2 / cam.zoom + pad;

    for (const f of foods) {
      if (inView(f)) {
        ctx.fillStyle = f.color;
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 7); ctx.fill();
      }
    }

    for (const v of viruses) {
      if (inView(v)) drawVirus(v);
    }

    for (const p of pellets) {
      if (inView(p)) {
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
      }
    }

    const sortedCells = [...player.cells, ...bots].sort((a, b) => a.mass - b.mass);
    for (const c of sortedCells) {
      if (!inView(c)) continue;
      
      const hasSkin = c.skin && c.skin.complete && c.skin.naturalWidth > 0;
      
      if (hasSkin) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(c.skin, c.x - c.r, c.y - c.r, c.r * 2, c.r * 2);
        ctx.restore();
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
        ctx.lineWidth = 3 / cam.zoom;
        ctx.stroke();
      } else {
        ctx.fillStyle = c.color;
        ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, 7); ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.2)';
        ctx.lineWidth = 2 / cam.zoom;
        ctx.stroke();
      }

      const fontSize = Math.max(12, c.r / 2.5);
      ctx.font = `bold ${fontSize}px Arial`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 4 / cam.zoom;
      ctx.lineJoin = 'round';
      
      const nickY = hasSkin ? c.y + c.r + fontSize * 0.8 : c.y;
      ctx.strokeText(c.nick || '', c.x, nickY);
      ctx.fillStyle = '#fff';
      ctx.fillText(c.nick || '', c.x, nickY);

      ctx.font = `${Math.max(8, c.r / 4)}px Arial`;
      ctx.strokeText(Math.round(c.mass), c.x, nickY + fontSize * 0.9);
      ctx.fillText(Math.round(c.mass), c.x, nickY + fontSize * 0.9);
    }

    ctx.restore();

    document.getElementById('mass').textContent = Math.round(totalMass);
    document.getElementById('pos').textContent = `${cx | 0}, ${cy | 0}`;
    document.getElementById('ping').textContent = Math.floor(Math.random() * 15) + 5;

    mm.fillStyle = '#0d1526'; mm.fillRect(0, 0, 160, 160);
    const s = 160 / CFG.WORLD;
    mm.strokeStyle = '#2b6ef6'; mm.lineWidth = 1;
    mm.strokeRect(cam.x * s - 10, cam.y * s - 10, 20, 20);
    mm.fillStyle = '#22c55e'; for (const v of viruses) mm.fillRect(v.x * s - 1, v.y * s - 1, 2, 2);
    mm.fillStyle = '#fff'; for (const b of bots) mm.fillRect(b.x * s, b.y * s, 2, 2);
    mm.fillStyle = player.color; for (const c of player.cells) mm.fillRect(c.x * s - 1, c.y * s - 1, 3, 3);

    if (analyser && micOn) {
      const t = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteTimeDomainData(t);
      const lvl = Math.max(...t.map(v => Math.abs(v - 128)));
      micBtn.classList.toggle('talking', lvl > 12);
    }

  } else {
    // Рендер на паузе
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.scale(cam.zoom, cam.zoom);
    ctx.translate(-cam.x, -cam.y);

    ctx.strokeStyle = '#1a2438'; ctx.lineWidth = 1 / cam.zoom;
    const step = 100;
    const x0 = Math.max(0, ((cam.x - W / 2 / cam.zoom) / step | 0) * step);
    const x1 = Math.min(CFG.WORLD, cam.x + W / 2 / cam.zoom);
    const y0 = Math.max(0, ((cam.y - H / 2 / cam.zoom) / step | 0) * step);
    const y1 = Math.min(CFG.WORLD, cam.y + H / 2 / cam.zoom);
    ctx.beginPath();
    for (let x = x0; x <= x1; x += step) { ctx.moveTo(x, y0); ctx.lineTo(x, y1); }
    for (let y = y0; y <= y1; y += step) { ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
    ctx.stroke();
    ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 6 / cam.zoom;
    ctx.strokeRect(0, 0, CFG.WORLD, CFG.WORLD);

    const pad = 100 / cam.zoom;
    const inView = o => o.x > cam.x - W / 2 / cam.zoom - pad && o.x < cam.x + W / 2 / cam.zoom + pad &&
                        o.y > cam.y - H / 2 / cam.zoom - pad && o.y < cam.y + H / 2 / cam.zoom + pad;
    
    const allCells = [...player.cells, ...bots];
    const sortedCells = [...allCells].sort((a, b) => a.mass - b.mass);
    
    for (const c of sortedCells) {
      if (!inView(c)) continue;
      ctx.fillStyle = c.color;
      ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 2 / cam.zoom; ctx.stroke();
      
      const fontSize = Math.max(12, c.r / 2.5);
      ctx.font = `bold ${fontSize}px Arial`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.strokeStyle = '#000'; ctx.lineWidth = 4 / cam.zoom; ctx.lineJoin = 'round';
      ctx.strokeText(c.nick || '', c.x, c.y);
      ctx.fillStyle = '#fff';
      ctx.fillText(c.nick || '', c.x, c.y);
    }
    ctx.restore();
  }
}
</script>
