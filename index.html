<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agario</title>
<style>
  :root{ --blue:#2b6ef6; --card:#131c31; --bg:#070d1a; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:Arial,sans-serif;overflow:hidden;color:#fff}
  body.playing{cursor:none}
  body.playing #menu{display:none}
  canvas#game{display:none}
  body.playing canvas#game{display:block}

  /* ===== МЕНЮ ===== */
  #menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:20px;overflow-y:auto}

  /* Верхние счётчики */
  #topCounters{display:flex;gap:12px;margin-bottom:20px}
  .counter{background:#1c2740;border-radius:16px;padding:6px 16px;font-size:14px;color:#cfd8ea}
  .counter b{color:#fff}

  /* Основная область */
  #mainArea{display:flex;gap:24px;align-items:flex-start;max-width:1200px;width:100%}

  /* Карточка с картинкой */
  #startCard{background:#131c31;border-radius:18px;padding:24px;width:380px;flex-shrink:0}
  #startImage{width:100%;height:220px;border-radius:12px;
    background:linear-gradient(180deg,#87ceeb 0%,#fff 40%,#f0f8ff 60%,#87ceeb 100%);
    position:relative;overflow:hidden;margin-bottom:20px}
  #startImage::before{content:'';position:absolute;inset:0;
    background:radial-gradient(circle at 50% 30%,rgba(255,255,255,0.9) 0%,transparent 50%)}
  #startImage::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    width:60%;height:40%;
    background:linear-gradient(180deg,transparent 0%,rgba(255,255,255,0.3) 100%);
    clip-path:polygon(40% 100%,60% 100%,55% 0%,45% 0%)}

  .btns{display:flex;gap:12px;margin-bottom:16px}
  .btn{border:0;border-radius:20px;padding:12px 22px;font-size:14px;font-weight:bold;
    cursor:pointer;display:flex;align-items:center;gap:8px;flex:1;justify-content:center}
  .btn.white{background:#fff;color:#2b6ef6}
  .btn.blue{background:var(--blue);color:#fff}

  .nick-wrap{display:flex;align-items:center;gap:8px;background:#1c2740;border-radius:20px;padding:4px}
  #nick{flex:1;background:transparent;border:0;padding:10px 14px;color:#fff;font-size:14px;outline:none}
  #colorDot{width:28px;height:28px;border-radius:50%;background:#ffa502;cursor:pointer;border:0}

  /* Карточка статистики */
  #statsCard{background:#131c31;border-radius:18px;padding:20px;flex:1;min-width:400px}
  .stats-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .stats-head h2{margin:0;font-size:20px}
  .period{background:#1c2740;border-radius:12px;padding:6px 12px;font-size:13px;cursor:pointer}

  .stats-table{width:100%;border-collapse:collapse}
  .stats-table th{text-align:left;padding:8px;color:#8fa1c0;font-size:13px;font-weight:normal;border-bottom:1px solid #1f2b45}
  .stats-table td{padding:10px 8px;font-size:14px;border-bottom:1px solid #1f2b45}
  .stats-table .pos{width:60px;text-align:center}
  .stats-table .mass{width:100px;text-align:right}
  .stats-table .skin{width:40px}
  .skin-circle{width:32px;height:32px;border-radius:50%;border:2px solid #c9a227}
  .pos-1{color:#f1c40f;font-weight:bold}
  .pos-2{color:#bdc3c7}
  .pos-3{color:#e67e22}

  /* Топ Сейчас */
  #topNow{position:fixed;top:20px;right:20px;background:#131c31;border-radius:12px;padding:14px;
    width:200px;max-height:400px;overflow-y:auto}
  #topNow h3{margin:0 0 10px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
  #topNow h3 span{cursor:pointer;color:#8fa1c0}
  .top-item{padding:4px 0;font-size:13px;display:flex;align-items:center;gap:8px}
  .top-item .num{width:20px;color:#8fa1c0}
  .top-item .name{flex:1}
  .top-item .badge{background:#c0392b;color:#fff;border-radius:8px;padding:2px 6px;font-size:10px}
  .top-item .star{color:#f1c40f}

  /* HUD */
  #hud{position:fixed;top:10px;left:12px;font-size:14px;color:#cfd8ea;display:none}
  body.playing #hud{display:block}
  #minimap{position:fixed;right:12px;bottom:12px;width:160px;height:160px;background:#0d1526cc;
    border:1px solid #1f2b45;border-radius:8px;display:none}
  body.playing #minimap{display:block}

  /* Микрофон */
  #micBtn{position:fixed;left:16px;bottom:16px;width:52px;height:52px;border-radius:50%;
    border:0;background:var(--blue);color:#fff;cursor:pointer;display:none;align-items:center;
    justify-content:center;box-shadow:0 0 0 0 rgba(43,110,246,.6);transition:.2s}
  body.playing #micBtn{display:flex}
  #micBtn.on{background:var(--blue)}
  #micBtn.off{background:#3a1620;color:#ff5566}
  #micBtn svg{width:24px;height:24px}
  #micBtn.talking{box-shadow:0 0 0 10px rgba(43,110,246,.25)}

  /* Кнопка паузы */
  #pauseBtn{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
    background:#1c2740;border:1px solid #2b6ef6;border-radius:24px;padding:12px 28px;
    color:#fff;font-size:16px;font-weight:bold;cursor:pointer;display:none;
    align-items:center;gap:8px;z-index:50}
  body.playing #pauseBtn{display:flex}
  #pauseBtn:hover{background:#2b6ef6}
</style>
</head>
<body>

<!-- ===== МЕНЮ ===== -->
<div id="menu">
  <div id="topCounters">
    <div class="counter">Максимум: <b id="maxOnline">712</b></div>
    <div class="counter">Сейчас: <b id="curOnline">0</b></div>
  </div>

  <div id="mainArea">
    <!-- Карточка старта -->
    <div id="startCard">
      <div id="startImage"></div>
      <div class="btns">
        <button class="btn white" id="spectateBtn">👁 Наблюдать</button>
        <button class="btn blue" id="playBtn">▶ ИГРАТЬ</button>
      </div>
      <div class="nick-wrap">
        <input id="nick" placeholder="nick" maxlength="15">
        <button id="colorDot" title="Перемешать цвет"></button>
      </div>
    </div>

    <!-- Статистика -->
    <div id="statsCard">
      <div class="stats-head">
        <h2>Статистика</h2>
        <div class="period">Сегодня ⌄</div>
      </div>
      <table class="stats-table">
        <thead><tr><th class="pos">Позиция</th><th>Ник</th><th class="mass">Масса</th><th class="skin">Скин</th></tr></thead>
        <tbody id="statsBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Топ Сейчас -->
  <div id="topNow">
    <h3>Топ Сейчас <span>✕</span></h3>
    <div id="topNowList"></div>
  </div>
</div>

<!-- ===== ИГРА ===== -->
<canvas id="game"></canvas>
<div id="hud">Масса: <b id="mass">20</b> · Позиция: <span id="pos"></span></div>
<canvas id="minimap" width="160" height="160"></canvas>

<button id="micBtn" title="Микрофон">
  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
</button>

<button id="pauseBtn">Pause ⏸</button>

<script>
const CFG = {
  WORLD: 14142,
  FOOD_COUNT: 3000,
  FOOD_MASS: 20,
  VIRUS_COUNT: 70,
  BOTS: 40,
  BASE_SPEED: 3.25,
  MASS_EXP: 0.44,
  RESPAWN_MS: 10000,
  MAX_CELLS: 14,
  MIN_CELL_MASS: 10,
  MERGE_COOLDOWN: 20,
  EJECT_MASS: 10
};

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const mm = document.getElementById('minimap').getContext('2d');
let W = innerWidth, H = innerHeight;
canvas.width = W; canvas.height = H;
addEventListener('resize', () => { W=innerWidth; H=innerHeight; canvas.width=W; canvas.height=H; });

const mouse = { x: W/2, y: H/2 };
addEventListener('mousemove', e => { mouse.x=e.clientX; mouse.y=e.clientY; });

const COLORS = ['#ff4757','#ffa502','#2ed573','#1e90ff','#a55eea','#ff6b81','#7bed9f','#70a1ff','#e74c3c','#3498db','#9b59b6','#1abc9c','#f1c40f','#e67e22'];
const rndColor = () => COLORS[(Math.random()*COLORS.length)|0];

const player = {
  nick: 'nick',
  color: rndColor(),
  cells: [{ x: CFG.WORLD/2, y: CFG.WORLD/2, mass: 20, vx: 0, vy: 0, mergeCooldown: 0 }]
};

const cam = { x: player.cells[0].x, y: player.cells[0].y, zoom: 1 };
let spectate = false, running = false, paused = false;

const getR = m => Math.sqrt(m) * 4;
const rnd = (a,b)=> a + Math.random()*(b-a);

function speedFor(mass){
  return Math.max(0.6, CFG.BASE_SPEED * Math.pow(20 / mass, CFG.MASS_EXP));
}

/* ===== ЕДА ===== */
const foods = [];
const spawnFood = () => ({ x:rnd(0,CFG.WORLD), y:rnd(0,CFG.WORLD), r:rnd(3,5), color:`hsl(${rnd(0,360)},70%,55%)` });

/* ===== ЗЕЛЁНЫЕ КУСТЫ ===== */
const viruses = [];
const spawnVirus = () => ({ x:rnd(0,CFG.WORLD), y:rnd(0,CFG.WORLD), r:rnd(28,40), spikes:16, mass:60 });

function respawnWave(){
  foods.length = 0;   for (let i=0;i<CFG.FOOD_COUNT;i++)  foods.push(spawnFood());
  viruses.length = 0; for (let i=0;i<CFG.VIRUS_COUNT;i++) viruses.push(spawnVirus());
}
respawnWave();
setInterval(respawnWave, CFG.RESPAWN_MS);

/* ===== БОТЫ ===== */
const bots = [];
const spawnBot = () => ({ x:rnd(0,CFG.WORLD), y:rnd(0,CFG.WORLD), mass:rnd(15,400),
  nick:'bot'+((Math.random()*999)|0), color:COLORS[(Math.random()*COLORS.length)|0], r:0, tx:0, ty:0 });
for (let i=0;i<CFG.BOTS;i++) bots.push(spawnBot());

/* ===== ВЫБРОС МАССЫ (W) ===== */
const pellets = [];
function ejectMass(){
  for (const cell of player.cells){
    if (cell.mass < CFG.MIN_CELL_MASS * 2) continue;
    cell.mass -= CFG.EJECT_MASS;
    const wx = (mouse.x-W/2)/cam.zoom + cam.x;
    const wy = (mouse.y-H/2)/cam.zoom + cam.y;
    const dx = wx - cell.x, dy = wy - cell.y;
    const d = Math.hypot(dx, dy) || 1;
    pellets.push({
      x: cell.x + (dx/d) * getR(cell.mass),
      y: cell.y + (dy/d) * getR(cell.mass),
      mass: CFG.EJECT_MASS,
      r: getR(CFG.EJECT_MASS),
      vx: (dx/d) * 20,
      vy: (dy/d) * 20,
      color: player.color
    });
  }
}

/* ===== РАЗДЕЛЕНИЕ (ПРОБЕЛ) ===== */
function split(){
  const newCells = [];
  for (const cell of player.cells){
    if (player.cells.length + newCells.length >= CFG.MAX_CELLS) break;
    if (cell.mass < CFG.MIN_CELL_MASS * 2) continue;
    const half = cell.mass / 2;
    cell.mass = half;
    const wx = (mouse.x-W/2)/cam.zoom + cam.x;
    const wy = (mouse.y-H/2)/cam.zoom + cam.y;
    const dx = wx - cell.x, dy = wy - cell.y;
    const d = Math.hypot(dx, dy) || 1;
    const impulse = 18;
    const newCell = {
      x: cell.x + (dx/d) * getR(half),
      y: cell.y + (dy/d) * getR(half),
      mass: half,
      vx: (dx/d) * impulse,
      vy: (dy/d) * impulse,
      mergeCooldown: CFG.MERGE_COOLDOWN
    };
    cell.vx = -(dx/d) * impulse;
    cell.vy = -(dy/d) * impulse;
    cell.mergeCooldown = CFG.MERGE_COOLDOWN;
    newCells.push(newCell);
  }
  player.cells.push(...newCells);
}

/* ===== УПРАВЛЕНИЕ ===== */
addEventListener('keydown', e => {
  if (!running) return;
  const key = e.key.toLowerCase();
  if (key === 'f' || key === 'а') { togglePause(); }
  if (key === ' ' && !paused) { split(); e.preventDefault(); }
  if ((key === 'w' || key === 'ц') && !paused) ejectMass();
});

addEventListener('wheel', e => {
  if (!running) return;
  cam.zoom *= e.deltaY > 0 ? 0.9 : 1.1;
  cam.zoom = Math.max(0.1, Math.min(3, cam.zoom));
  e.preventDefault();
}, { passive: false });

/* ===== ПАУЗА ===== */
const pauseBtn = document.getElementById('pauseBtn');
function togglePause(){
  paused = !paused;
  pauseBtn.innerHTML = paused ? 'Play ▶' : 'Pause ⏸';
}
pauseBtn.onclick = togglePause;

/* ===== МЕНЮ ===== */
document.getElementById('playBtn').onclick = () => start(false);
document.getElementById('spectateBtn').onclick = () => start(true);
document.getElementById('colorDot').onclick = e => {
  player.color = rndColor();
  e.target.style.background = player.color;
};

function start(spec){
  player.nick = document.getElementById('nick').value || 'nick';
  player.color = rndColor();
  player.cells = [{ x:rnd(0,CFG.WORLD), y:rnd(0,CFG.WORLD), mass: 20, vx: 0, vy: 0, mergeCooldown: 0, nick: player.nick, color: player.color }];
  cam.x = player.cells[0].x; cam.y = player.cells[0].y; cam.zoom = 1;
  document.getElementById('colorDot').style.background = player.color;

  spectate = spec;
  paused = false;
  pauseBtn.innerHTML = 'Pause ⏸';
  document.body.classList.add('playing');
  running = true;
  requestMic();
  animate();
}

/* ===== МИКРОФОН ===== */
const micBtn = document.getElementById('micBtn');
let micStream=null, micOn=false, micDenied=false, audioCtx=null, analyser=null;
async function requestMic(){
  if (micStream || micDenied) return;
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true }});
    micOn = true; paintMic();
    audioCtx = new AudioContext();
    analyser = audioCtx.createAnalyser(); analyser.fftSize = 256;
    audioCtx.createMediaStreamSource(micStream).connect(analyser);
  } catch(e){ micDenied = true; paintMic(); }
}
micBtn.onclick = () => {
  if (!micStream){ requestMic(); return; }
  micOn = !micOn;
  micStream.getAudioTracks()[0].enabled = micOn;
  paintMic();
};
function paintMic(){
  micBtn.className = micOn ? 'on' : 'off';
  micBtn.innerHTML = micOn
    ? `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>`
    : `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/><line x1="3" y1="3" x2="21" y2="21" stroke="currentColor" stroke-width="2"/></svg>`;
}

/* ===== РИСОВКА КУСТА ===== */
function drawVirus(v){
  ctx.save();
  ctx.translate(v.x, v.y);
  ctx.beginPath();
  for (let i=0;i<v.spikes;i++){
    const a = (i/v.spikes)*Math.PI*2;
    const rOut = v.r, rIn = v.r*0.78;
    ctx.lineTo(Math.cos(a)*rOut, Math.sin(a)*rOut);
    ctx.lineTo(Math.cos(a+Math.PI/v.spikes)*rIn, Math.sin(a+Math.PI/v.spikes)*rIn);
  }
  ctx.closePath();
  ctx.fillStyle = '#22c55e';
  ctx.fill();
  ctx.strokeStyle = '#15803d';
  ctx.lineWidth = 2/cam.zoom;
  ctx.stroke();
  ctx.restore();
}

/* ===== СТАТИСТИКА ===== */
function generateStats(){
  const tbody = document.getElementById('statsBody');
  tbody.innerHTML = '';
  const masses = [112184, 82979, 79513, 75743, 74917, 72683, 72348, 67873, 67447, 64139];
  for (let i=0;i<10;i++){
    const tr = document.createElement('tr');
    const posClass = i<3 ? `pos-${i+1}` : '';
    tr.innerHTML = `
      <td class="pos ${posClass}">${i+1}</td>
      <td>Ник</td>
      <td class="mass">${masses[i]}</td>
      <td class="skin"><div class="skin-circle" style="background:${rndColor()}"></div></td>
    `;
    tbody.appendChild(tr);
  }
}
generateStats();
setInterval(generateStats, 60000); // обновление раз в минуту

/* ===== ТОП СЕЙЧАС ===== */
const topNames = ['rrrrr','ZZZ','ЯгодКАН','СТУДЕНТ','Сталин','огуша','death','Зая','ЕДИНИЦА LAG','111'];
function renderTopNow(){
  const list = document.getElementById('topNowList');
  list.innerHTML = '';
  topNames.forEach((name,i)=>{
    const div = document.createElement('div');
    div.className = 'top-item';
    let badge = '';
    if (name === 'ЯгодКАН') badge = '<span class="badge">103</span>';
    if (name === 'death') badge = '<span class="badge">185</span>';
    const star = ['СТУДЕНТ','Сталин'].includes(name) ? '<span class="star">⭐</span>' : '';
    div.innerHTML = `<span class="num">${i+1}.</span><span class="name">${star}${name}</span>${badge}`;
    list.appendChild(div);
  });
}
renderTopNow();

/* Счётчики онлайна */
let curOnline = 0;
setInterval(()=>{
  curOnline = Math.floor(Math.random()*50)+10;
  document.getElementById('curOnline').textContent = curOnline;
}, 5000);

/* ===== ИГРОВОЙ ЦИКЛ ===== */
function animate(){
  if (!running) return;
  requestAnimationFrame(animate);

  ctx.fillStyle = '#0a0f1c'; ctx.fillRect(0,0,W,H);

  if (!paused){
    let totalMass = 0, cx = 0, cy = 0;
    for (const cell of player.cells){
      totalMass += cell.mass;
      cx += cell.x * cell.mass;
      cy += cell.y * cell.mass;
    }
    cx /= totalMass; cy /= totalMass;
    cam.x += (cx-cam.x)*0.12; cam.y += (cy-cam.y)*0.12;
    const targetZoom = Math.max(.3, Math.min(1.6, Math.pow(30/getR(totalMass), .55)));
    cam.zoom += (targetZoom-cam.zoom)*0.08;

    ctx.save();
    ctx.translate(W/2, H/2); ctx.scale(cam.zoom, cam.zoom); ctx.translate(-cam.x, -cam.y);

    ctx.strokeStyle='#1a2438'; ctx.lineWidth=1/cam.zoom;
    const step=100, x0=Math.max(0,(cam.x-W/2/cam.zoom)/step|0)*step, x1=Math.min(CFG.WORLD,cam.x+W/2/cam.zoom),
          y0=Math.max(0,(cam.y-H/2/cam.zoom)/step|0)*step, y1=Math.min(CFG.WORLD,cam.y+H/2/cam.zoom);
    ctx.beginPath();
    for(let x=x0;x<x1;x+=step){ctx.moveTo(x,y0);ctx.lineTo(x,y1);}
    for(let y=y0;y<y1;y+=step){ctx.moveTo(x0,y);ctx.lineTo(x1,y);}
    ctx.stroke();
    ctx.strokeStyle='#c0392b'; ctx.lineWidth=6/cam.zoom;
    ctx.strokeRect(0,0,CFG.WORLD,CFG.WORLD);

    // ДВИЖЕНИЕ КЛЕТОК ИГРОКА
    for (const cell of player.cells){
      const wx = (mouse.x-W/2)/cam.zoom + cam.x, wy = (mouse.y-H/2)/cam.zoom + cam.y;
      const dx = wx - cell.x, dy = wy - cell.y;
      const d = Math.hypot(dx, dy);
      if (d > 2){
        const sp = speedFor(cell.mass);
        cell.vx += (dx/d) * sp * 0.15;
        cell.vy += (dy/d) * sp * 0.15;
      }
      cell.vx *= 0.88;
      cell.vy *= 0.88;
      cell.x += cell.vx;
      cell.y += cell.vy;
      cell.x = Math.max(0, Math.min(CFG.WORLD, cell.x));
      cell.y = Math.max(0, Math.min(CFG.WORLD, cell.y));
      cell.r = getR(cell.mass);
      if (cell.mergeCooldown > 0) cell.mergeCooldown -= 1/60;
    }

    // ПРИТЯЖЕНИЕ И СЛИЯНИЕ КЛЕТОК
    for (let i=0; i<player.cells.length; i++){
      for (let j=i+1; j<player.cells.length; j++){
        const a = player.cells[i], b = player.cells[j];
        if (a.mergeCooldown > 0 || b.mergeCooldown > 0) continue;
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy);
        const minDist = getR(a.mass) + getR(b.mass);
        if (d < minDist * 0.8){
          a.mass += b.mass;
          player.cells.splice(j, 1);
          j--;
        } else {
          const force = 0.3;
          a.vx += (dx/d) * force;
          a.vy += (dy/d) * force;
          b.vx -= (dx/d) * force;
          b.vy -= (dy/d) * force;
        }
      }
    }

    // ИИ ботов
    for (const b of bots){
      b.r = getR(b.mass);
      if (!b.tx || Math.hypot(b.tx-b.x,b.ty-b.y)<20 || Math.random()<0.015){
        const f = foods[(Math.random()*foods.length)|0]; if(f){b.tx=f.x; b.ty=f.y;}
      }
      const d = Math.hypot(b.tx-b.x,b.ty-b.y)||1, sp=speedFor(b.mass);
      b.x+= (b.tx-b.x)/d*sp; b.y+=(b.ty-b.y)/d*sp;
      b.x=Math.max(0,Math.min(CFG.WORLD,b.x)); b.y=Math.max(0,Math.min(CFG.WORLD,b.y));
    }

    // ПОЕДАНИЕ ЕДЫ
    const allCells = [...player.cells, ...bots];
    for (const c of allCells){
      for (let i=foods.length-1;i>=0;i--){
        const f=foods[i];
        if (Math.abs(f.x-c.x)<c.r && Math.abs(f.y-c.y)<c.r){
          c.mass += CFG.FOOD_MASS;
          foods.splice(i,1);
        }
      }
    }

    // ПОЕДАНИЕ КУСТОВ
    for (const c of allCells){
      for (let i=viruses.length-1;i>=0;i--){
        const v=viruses[i];
        if (c.r > v.r*1.5 && Math.hypot(v.x-c.x, v.y-c.y) < c.r){
          c.mass += v.mass; viruses.splice(i,1);
        }
      }
    }

    // ПОЕДАНИЕ ПОРОШКОВ
    for (const c of allCells){
      for (let i=pellets.length-1;i>=0;i--){
        const p=pellets[i];
        if (Math.abs(p.x-c.x)<c.r && Math.abs(p.y-c.y)<c.r){
          c.mass += p.mass; pellets.splice(i,1);
        }
      }
    }

    // ПОЕДАНИЕ ДРУГ ДРУГА
    for (let i=0;i<allCells.length;i++){
      for (let j=0;j<allCells.length;j++){
        if (i===j) continue;
        const a=allCells[i], b=allCells[j];
        if (a.r > b.r*1.15 && Math.hypot(a.x-b.x,a.y-b.y) < a.r){
          a.mass += b.mass;
          const idx = player.cells.indexOf(b);
          if (idx >= 0){ player.cells.splice(idx,1); }
          if (player.cells.length === 0){
            player.cells = [{ x:rnd(0,CFG.WORLD), y:rnd(0,CFG.WORLD), mass: 20, vx:0, vy:0, mergeCooldown:0, nick: player.nick, color: player.color }];
            player.color = rndColor();
          }
          if (bots.includes(b)) Object.assign(b, spawnBot());
        }
      }
    }

    // Движение порошков
    for (let i=pellets.length-1;i>=0;i--){
      const p=pellets[i];
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.9; p.vy *= 0.9;
      p.x = Math.max(0, Math.min(CFG.WORLD, p.x));
      p.y = Math.max(0, Math.min(CFG.WORLD, p.y));
    }

    // РЕНДЕР
    const pad = 80/cam.zoom;
    const inView = o => o.x>cam.x-W/2/cam.zoom-pad && o.x<cam.x+W/2/cam.zoom+pad
                     && o.y>cam.y-H/2/cam.zoom-pad && o.y<cam.y+H/2/cam.zoom+pad;

    for (const f of foods) if (inView(f)){ ctx.fillStyle=f.color; ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,7); ctx.fill(); }
    for (const v of viruses) if (inView(v)) drawVirus(v);
    for (const p of pellets) if (inView(p)){ ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); }
    for (const c of allCells) if (inView(c)){
      ctx.fillStyle=c.color; ctx.beginPath(); ctx.arc(c.x,c.y,c.r,0,7); ctx.fill();
      const fontSize = Math.max(12, c.r/2.5);
      ctx.font=`bold ${fontSize}px Arial`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 3/cam.zoom;
      ctx.lineJoin = 'round';
      ctx.strokeText(c.nick || '', c.x, c.y);
      ctx.fillStyle = '#fff';
      ctx.fillText(c.nick || '', c.x, c.y);
    }
    ctx.restore();

    // HUD
    document.getElementById('mass').textContent = Math.round(totalMass);
    document.getElementById('pos').textContent = `${cx|0}, ${cy|0}`;

    // миникарта
    mm.fillStyle='#0d1526'; mm.fillRect(0,0,160,160);
    const s=160/CFG.WORLD;
    mm.strokeStyle='#2b6ef6'; mm.strokeRect(cam.x*s-10,cam.y*s-10,20,20);
    mm.fillStyle='#22c55e'; for(const v of viruses){mm.fillRect(v.x*s-1,v.y*s-1,2,2);}
    mm.fillStyle='#fff'; for(const b of bots){mm.fillRect(b.x*s,b.y*s,2,2);}
    mm.fillStyle=player.color; for(const c of player.cells){mm.fillRect(c.x*s-1,c.y*s-1,3,3);}

    // пульсация микрофона
    if (analyser && micOn){
      const t=new Uint8Array(analyser.frequencyBinCount); analyser.getByteTimeDomainData(t);
      const lvl=Math.max(...t.map(v=>Math.abs(v-128)));
      micBtn.classList.toggle('talking', lvl>12);
    }
  }
}
</script>
</body>
